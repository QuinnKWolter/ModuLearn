    <script>
        var prevQuesIndx = -1;

        var pretestQuestions = [{
                id: "pretest_qj_if",
                name: "Question 1",
                url: "https://adapt2.sis.pitt.edu/quizjet/displayQuiz.jsp?rdfID=pretest_qj_if&act=Decisions&sub=pretest_qj_if&svc=pretest&trace=false"
            },
            {
                id: "pretest_qj_while",
                name: "Question 2",
                url: "https://adapt2.sis.pitt.edu/quizjet/displayQuiz.jsp?rdfID=pretest_qj_while&act=Loops_while&sub=pretest_qj_while&svc=pretest&trace=false"
            },
            {
                id: "pretest_qj_for",
                name: "Question 3",
                url: "https://adapt2.sis.pitt.edu/quizjet/displayQuiz.jsp?rdfID=pretest_qj_for&act=Loops_for&sub=pretest_qj_for&svc=pretest&trace=false"
            },
            {
                id: "pretest_qj_array",
                name: "Question 4",
                url: "https://adapt2.sis.pitt.edu/quizjet/displayQuiz.jsp?rdfID=pretest_qj_array&act=Arrays&sub=pretest_qj_array&svc=pretest&trace=false"
            },
            {
                id: "pretest_qj_2darray",
                name: "Question 5",
                url: "https://adapt2.sis.pitt.edu/quizjet/displayQuiz.jsp?rdfID=pretest_qj_2darray&act=Two-dimensional_Arrays&sub=pretest_qj_2darray&svc=pretest&trace=false"
            },
            {
                id: "pretest_boolean",
                name: "Question 6",
                // url: "https://pcrs.teach.cs.toronto.edu/dev_serve/problems/java/378/embed?act=PCRS&sub=pretest_boolean"
                // url: "https://vm003.teach.cs.toronto.edu/dev_serve/problems/java/378/embed?act=PCRS&sub=pretest_boolean"
                url: "https://pcrs.utm.utoronto.ca/mgrids/problems/java/378/embed?act=PCRS&sub=pretest_boolean"
            },
            {
                id: "pretest_ifelse",
                name: "Question 7",
                // url: "https://pcrs.teach.cs.toronto.edu/dev_serve/problems/java/381/embed?act=PCRS&sub=pretest_ifelse"
                //url: "https://vm003.teach.cs.toronto.edu/dev_serve/problems/java/381/embed?act=PCRS&sub=pretest_ifelse"
                url: "https://pcrs.utm.utoronto.ca/mgrids/problems/java/381/embed?act=PCRS&sub=pretest_ifelse"
            },
            {
                id: "pretest_array",
                name: "Question 8",
                // url: "https://pcrs.teach.cs.toronto.edu/dev_serve/problems/java/380/embed?act=PCRS&sub=pretest_array"
                // url: "https://vm003.teach.cs.toronto.edu/dev_serve/problems/java/380/embed?act=PCRS&sub=pretest_array"
                url: "https://pcrs.utm.utoronto.ca/mgrids/problems/java/380/embed?act=PCRS&sub=pretest_array"
            },
            {
                id: "pretest_nested_for",
                name: "Question 9",
                // url: "https://pcrs.teach.cs.toronto.edu/dev_serve/problems/java/379/embed?act=PCRS&sub=pretest_nested_for"
                //url: "https://vm003.teach.cs.toronto.edu/dev_serve/problems/java/379/embed?act=PCRS&sub=pretest_nested_for"
                 url: "https://pcrs.utm.utoronto.ca/mgrids/problems/java/379/embed?act=PCRS&sub=pretest_nested_for"
            },
            {
                id: "pretest_method",
                name: "Question 10",
                // url: "https://pcrs.teach.cs.toronto.edu/dev_serve/problems/java/382/embed?act=PCRS&sub=pretest_method"
                // url: "https://vm003.teach.cs.toronto.edu/dev_serve/problems/java/382/embed?act=PCRS&sub=pretest_method"
                url: "https://pcrs.utm.utoronto.ca/mgrids/problems/java/382/embed?act=PCRS&sub=pretest_method"
            }

        ];
        
        var attemptInfo = [
               { id: "pretest_qj_if", attempted: "0" } ,
               { id: "pretest_qj_while", attempted: "0" } ,
               { id: "pretest_qj_for", attempted: "0" } ,
               { id: "pretest_qj_array", attempted: "0" } ,
               { id: "pretest_qj_2darray", attempted: "0" } ,
               { id: "pretest_boolean", attempted: "0" } ,
               { id: "pretest_ifelse", attempted: "0" } ,
               { id: "pretest_array", attempted: "0" } , 
               { id: "pretest_nested_for", attempted: "0" } , 
               { id: "pretest_method", attempted: "0" } ];




        $(document).ready(function() {
            getPastAttempts();
            document.getElementById("frame-pretest-problem").addEventListener("load", loaded);
			$("#frame-pretest-problem").width("100%");
			$("#frame-pretest-problem").height("100%");
			
            var params = $getQS();
            var pretestIframe = $("#frame-pretest-problem").attr('src', "pretest_instructions.html");
			
            for (var i = 0; i < pretestQuestions.length; i++) {
                $("#q" + (i + 1)).on('click', {
                    currentIndex: i
                }, function(event) {
                    $(".pretest-question").removeClass("pretest-current-question");
                    // process attempt 
                    if (prevQuesIndx != -1) processAttempt(pretestQuestions[prevQuesIndx].id);
                    var currentIndex = event.data.currentIndex
                    prevQuesIndx = currentIndex
                    
					$("#q" + (currentIndex + 1)).addClass("pretest-current-question");
                    if (currentIndex == 9) {
                       document.getElementById("doneBtn").className = "doneBtn";
                       document.getElementById("doneBtn").disabled = false;
                    }
					
					$("#loader").show();
					$("#frame-pretest-problem").width('0px');
					$("#frame-pretest-problem").height('0px');
					$("#frame-pretest-problem").attr('src', pretestQuestions[currentIndex].url + "&usr=" + params.usr + "&grp=" + params.grp + "&sid=" + params.sid)
                });
           }
		
        document.getElementById("doneBtn").addEventListener("click", function() {            
          		//check if last question clicked is submitted 
          		if (prevQuesIndx != -1) processAttemptBeforeDoneClicked(pretestQuestions[prevQuesIndx].id);
            });		
     });
        
        function getPastAttempts(){
            var questions = "";
            for (var i = 0; i < pretestQuestions.length; i++) {
                 questions += (questions === "" ? "" : ",") + pretestQuestions[i].id;
            }
            var uri = "https://adapt2.sis.pitt.edu/pretestServices/GetPastAttempts?usr=" + CONST.usr + 
            		  "&grp=" + CONST.grp + "&questions=" + questions;
            $call("GET", uri, null, getPastAttempts_cb, true, false);
        }
        
        function getPastAttempts_cb(rsp) {
			for(var l = 0; l < rsp.length; l++) {
    			name = rsp[l].name;
			    state = rsp[l].attempted;
			    for (var i = 0; i < attemptInfo.length; ++i) {
			        if (attemptInfo[i]['id'] === name ) {
			            attemptInfo[i]['attempted'] = state;
			            if ( attemptInfo[i].attempted === "1" ) {
					        $('#q'+(i+1)).unbind('click')
							 if (document.getElementById('q'+(i+1)).innerHTML.indexOf('Submitted') == -1 ) {
								 document.getElementById('q'+(i+1)).innerHTML = 
								 document.getElementById('q'+(i+1)).innerHTML +
								 "<span style=\"color:blue;font-weight:bold;font-size: 10pt;float:right\">" +
								 "(Submitted)</span>";
						   }
			            
			            }
			        }
			    }
            }
		}

        function loaded() {
			$("#loader").hide();
			//$("#frame-pretest-problem").show();
			$("#frame-pretest-problem").width('100%');
			$("#frame-pretest-problem").height('100%');
        }


		function processAttempt(prevAttempt){
			var uri = "https://adapt2.sis.pitt.edu/pretestServices/ProcessAttempt?usr=" + CONST.usr + 
					  "&grp=" + CONST.grp + "&cid=" + CONST.cid +
					  "&prevAttempt=" + prevAttempt + "&event=pretest";
			$call("GET", uri, null, processAttempt_cb, true, false);
		}
		
		function processAttemptBeforeDoneClicked(prevAttempt){
			var uri = "https://adapt2.sis.pitt.edu/pretestServices/ProcessAttempt?usr=" + CONST.usr + 
					  "&grp=" + CONST.grp + "&cid=" + CONST.cid +
					  "&prevAttempt=" + prevAttempt + "&event=pretest";
			$call("GET", uri, null, processAttemptBeforeDoneClicked_cb, true, false);
		}

		function processAttempt_cb(rsp) {
			prevAttemptName = rsp.name;
			prevAttemptState = rsp.attempted;
			for (var i = 0; i < attemptInfo.length; ++i) {
			   if (attemptInfo[i]['id'] === prevAttemptName ) {
				   attemptInfo[i]['attempted'] = prevAttemptState;
				   if ( attemptInfo[i].attempted === "1" ) {
					$('#q'+(i+1)).unbind('click')		
                    if (document.getElementById('q'+(i+1)).innerHTML.indexOf('Submitted') == -1 ) {
                            document.getElementById('q'+(i+1)).innerHTML = 
                            document.getElementById('q'+(i+1)).innerHTML +
                            "<span style=\"color:blue;font-weight:bold;font-size: 10pt;float:right\">" +
                            "(Submitted)</span>";
                    }
                            
                  }
			   }
			}
		}
		
		function processAttemptBeforeDoneClicked_cb(rsp) {
			prevAttemptName = rsp.name;
			prevAttemptState = rsp.attempted;
			for (var i = 0; i < attemptInfo.length; ++i) {
			   if (attemptInfo[i]['id'] === prevAttemptName ) {
				   attemptInfo[i]['attempted'] = prevAttemptState;
				   if ( attemptInfo[i].attempted === "1" ) {
                       if (document.getElementById('q'+(i+1)).innerHTML.indexOf('Submitted') == -1 ) {
                             document.getElementById('q'+(i+1)).innerHTML = 
                             document.getElementById('q'+(i+1)).innerHTML +
                             "<span style=\"color:blue;font-weight:bold;font-size: 10pt;float:right\">" +
                             "(Submitted)</span>";
                       }
                            
                  }
			   }
			}
			var remainedQ = new Array();
			for (var i = 0; i < attemptInfo.length; ++i) {
			   if ( attemptInfo[i].attempted === "0" ) {
				   remainedQ.push("Question" + (i+1));
			   }
			}
			var remainedQnames = "";
			for ( var i = 0; i < remainedQ.length; ++i) {
				remainedQnames += (remainedQnames === "" ? "" : ", ") + remainedQ[i];
			}
			
			var message = "";
			if (remainedQnames.length > 0) {
				message = "You have not submitted your answer for the following questions:" +
						  "\n" + remainedQnames
			}
			message += (message === "" ? "" : "\n") + "Are you sure you finished the pretest?";
			
		    if (!confirm(message)) {
				return;
			} else {
				processAttempt(pretestQuestions[prevQuesIndx].id);
				finishTest();
				window.location = "pretest_finished.html?usr=" + params.usr + "&grp=" + params.grp + "&sid=" + params.sid;;
			}						
		}
		


        /**
        Added the following parts to track actions performed in iFrame
        **/
        // Use an IIFE to keep our code from polluting the global scope
        (function(window) {

            addEvent(window, 'message', function(message) {
                // The namespace of the Data Layer is window.dataLayer by default,
                // but this CAN be changed; ensure that this is not customized
                // in the context this code will execute in
                var dataLayer = window.dataLayer || (window.dataLayer = []); // Safely instantiate dataLayer locally

                // The message.data value is arbitrary and can be customized
                //    if (message.data === 'formSubmit' && message.origin === 'IFRAME_PROTOCOL_HOSTNAME_AND_PORT') { // Check this is a whitelisted message & origin
                if (message.data === 'formSubmit') {
                    dataLayer.push({
                        // The key 'event' is required for GTM; the value is arbitrary and can be customized
                        'event': 'formSubmit' // Notify GTM via pushing this event
                    });
                }

            });

            // Cross-browser event listener
            function addEvent(el, evt, fn) {
                if (el.addEventListener) {
                    el.addEventListener(evt, fn);
                } else if (el.attachEvent) {
                    el.attachEvent('on' + evt, function(evt) {
                        fn.call(el, evt);
                    });
                } else if (typeof el['on' + evt] === 'undefined' || el['on' + evt] === null) {
                    el['on' + evt] = function(evt) {
                        fn.call(el, evt);
                    };
                }
            }

        })(window);
    </script>
