
{% load ui_i18n %}{% load static i18n %}
{% if study_shell %}
<style>
  body.study-shell { background: #f8fafc; }
  .dark body.study-shell { background: #0f172a; }
  .study-shell > .shell-section { padding-top: 1rem; padding-bottom: 1rem; }
  .study-shell .breadcrumb-nav { display: none; }
  .study-preview > main { padding-top: 4.5rem; }
  .study-preview > .shell-section { padding-top: 4.5rem; }
</style>

{% endif %}
{% if study_player %}
<form class="study-next" method="post" action="{{ study_player.continue_url }}" data-study-next hidden>
  {% csrf_token %}<input type="hidden" name="activity_id"><button type="submit" class="btn btn-primary">{% ui 'Next' %} <span aria-hidden="true">→</span></button>
</form>
<style>
.study-next{position:fixed;bottom:max(1rem,env(safe-area-inset-bottom));right:max(1rem,env(safe-area-inset-right));z-index:1000;margin:0}
.study-next[hidden]{display:none}.study-next button{min-width:7rem;padding:.7rem 1.3rem;font-size:1rem;box-shadow:0 3px 16px #0003}
body:has(.study-next:not([hidden])){padding-bottom:4.5rem}
</style>
{{ study_player|json_script:'study-player-config' }}
<script defer src="{% static 'js/study-player.js' %}"></script>
{% endif %}
