
{% load ui_i18n %}<div class="card border border-gray-200 dark:border-gray-700 overflow-hidden">
  <h2 id="heading{{ course_instance.id }}">
    <button class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors"
            type="button" data-bs-toggle="collapse"
            data-bs-target="#collapse{{ course_instance.id }}" aria-expanded="false"
            aria-controls="collapse{{ course_instance.id }}">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center shrink-0">
          <i class="bi bi-book text-blue-600 dark:text-blue-400"></i>
        </div>
        <div>
          <div class="font-semibold" data-no-ui-translate>{{ course_instance.course.title }}</div>
          <div class="text-sm text-gray-500 dark:text-gray-400">
            <i class="bi bi-tag mr-1"></i><span data-no-ui-translate>{{ course_instance.group_name }}</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span class="badge badge-info">{% ui_count "student" "students" course_instance.enrollments.count %}</span>
        <i class="bi bi-chevron-down text-gray-400 accordion-arrow"></i>
      </div>
    </button>
  </h2>
  <div id="collapse{{ course_instance.id }}" class="hidden" aria-labelledby="heading{{ course_instance.id }}">
    <div class="px-4 pb-4 pt-2">
{% include 'dashboard/components/session_controls.html' %}
    </div>
  </div>
</div>
