# run: docker-compose up
version: "3"
services:
  webapp:
    container_name: modulearn__webapp
    build:
      context: ./ModuLearn/modulearn/
      dockerfile: ./Dockerfile
    ports:
      - "20600:8000"
    restart: always
    env_file:
      - ./.env
    environment:
      DJANGO_PRODUCTION: "True"
      PRIMARY_DOMAIN: "https://adapt2.sis.pitt.edu"
      ALLOWED_HOSTS: "adapt2.sis.pitt.edu,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://adapt2.sis.pitt.edu"
      PROXY_CORS_ORIGIN: "https://adapt2.sis.pitt.edu"
      DJANGO_FORCE_SCRIPT_NAME: "/modulearn"
      STATIC_URL: "/modulearn-static/"
      MEDIA_URL: "/modulearn/media/"
      SERVE_MEDIA_FILES: "True"
    volumes:
      - ./modulearn-storage/db:/modulearn-storage/db
      - ./modulearn-storage/media:/modulearn/media
      - ./.env:/.env:ro
    extra_hosts:
      # Same-host Pitt services: override in the deployment .env only after
      # checking reachability from this container. See ../modulearn/docs/deployment-adapt2.md.
      - "host.docker.internal:${MODULEARN_HOST_GATEWAY:-host-gateway}"
      - "adapt2.sis.pitt.edu:${MODULEARN_HOST_GATEWAY:-host-gateway}"
      - "pawscomp2.sis.pitt.edu:${MODULEARN_HOST_GATEWAY:-host-gateway}"
      - "pawscomp2:${MODULEARN_HOST_GATEWAY:-host-gateway}"
